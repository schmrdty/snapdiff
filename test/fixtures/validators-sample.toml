# Sample validators file for tests. Keys are made up except the two real public ones
# used for the peer-id derivation check.
[consensus]
num_shards = 2

[[consensus.validator_sets]]
effective_at = 0
shard_ids = [ 0, 1, 2 ]
validator_public_keys = [
  "aaaaaaaa00000000000000000000000000000000000000000000000000000001", # one
  "bbbbbbbb00000000000000000000000000000000000000000000000000000002", # two
]

# Shard 0: snapshot 1_000; comment with 64 hex that must be ignored: cccccccc00000000000000000000000000000000000000000000000000000003
[[consensus.validator_sets]]
effective_at = 1_000
shard_ids = [ 0 ]
validator_public_keys = [
  "aaaaaaaa00000000000000000000000000000000000000000000000000000001",
  "ec2937c83922ff75785ab2d552f177f83fc72cf6aaf8aee7e330e6d4c338bd50", # joins on shard 0 at 1000
]

[[consensus.validator_sets]]
effective_at = 5_000
shard_ids = [ 1, 2 ]
validator_public_keys = [
  "aaaaaaaa00000000000000000000000000000000000000000000000000000001",
  "ec2937c83922ff75785ab2d552f177f83fc72cf6aaf8aee7e330e6d4c338bd50",
]
